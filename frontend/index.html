<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond Comfort</title><meta name="description" content="Card-mediated self-compassion reflection study"><link rel="stylesheet" href="/styles.css"></head>
<body>
<main class="shell">
  <header><div><p class="eyebrow">Remote participant study</p><h1>Beyond Comfort</h1></div><button id="accountButton" class="quiet hidden">账户</button></header>
  <section id="auth" class="panel auth-grid">
    <form id="loginForm" class="stack"><h2>继续实验</h2><label>实验用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form>
    <form id="registerForm" class="stack"><h2>注册参与者账号</h2><label>实验用户名<input name="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_-]+" autocomplete="username" required></label><label>密码（至少10位）<input name="password" type="password" minlength="10" autocomplete="new-password" required></label><label class="consent"><input name="consent" type="checkbox" required><span>我已阅读研究说明，理解健康与日程汇总只作为不确定线索，并同意参与。</span></label><button>同意并注册</button></form>
    <p id="authError" class="error"></p>
  </section>
  <section id="account" class="panel hidden"><div class="stack"><h2>参与者账户</h2><p id="identity"></p><button id="returnStudy" class="quiet">返回实验</button><button id="makeToken">生成/更换快捷指令令牌</button><div id="tokenResult" class="token hidden"></div><button id="logout" class="quiet">退出登录</button><button id="deleteAccount" class="danger">删除我的全部实验数据</button></div></section>
  <section id="study" class="hidden"><section id="status" class="context"><span class="dot"></span><span>正在读取你的最近一次健康与日程线索…</span></section><section id="messages" class="messages" aria-live="polite"></section><section id="panel" class="panel"></section><form id="composer" class="composer hidden"><textarea id="draft" rows="2" maxlength="5000" placeholder="写下你的回应…"></textarea><button type="submit">发送</button></form></section>
</main><script src="/app.js" defer></script>
</body></html>
